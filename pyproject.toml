[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elmathbind-secretcommit"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别密钥与令牌的误提交上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "elmathbind" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://elmathbind.github.io"
Repository = "https://github.com/elmathbind/secretcommit"
Issues = "https://github.com/elmathbind/secretcommit/issues"

[project.scripts]
secretcommit = "secretcommit:main"

[tool.setuptools]
py-modules = ["secretcommit"]
